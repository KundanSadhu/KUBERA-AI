name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JavaScript workflow and source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check repository whitespace
        run: git diff --check

      - name: Check JavaScript modules
        run: npm run check

      - name: Exercise managed workforce and desktop persistence contract
        run: |
          npm run test:agents
          npm run test:desktop
